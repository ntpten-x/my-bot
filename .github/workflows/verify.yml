name: Verify MY-BOT
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      AI_KEY_SECRET: synthetic-ci-encryption-key-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: npm audit --audit-level=high
