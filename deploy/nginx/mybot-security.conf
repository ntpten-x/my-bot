# Include in the http {} block. Prepared configuration; does not start a service.
# Terminate TLS at your trusted edge; upstream MY-BOT must not be publicly reachable.
limit_req_zone $binary_remote_addr zone=mybot_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=mybot_connections:10m;
server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 4m;
    client_body_timeout 10s;
    limit_conn mybot_connections 10;
    location ~ ^/api/auth/(login|reset-password|setup|step-up|mfa)$ {
        limit_req zone=mybot_auth burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        # Replace rather than append caller-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 310s;
    }
}
